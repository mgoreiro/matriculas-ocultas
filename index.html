<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrículas ocultas</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#657080; --card:#fff; --line:#d9dde3; --accent:#1f6feb; --danger:#d1342f; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --fg:#e8eaed; --muted:#9aa4b2; --card:#1d2126; --line:#333a43; --accent:#5b9bff; --danger:#ff6b66; } }
  * { box-sizing: border-box; } [hidden] { display:none !important; }
  body { margin:0; font:15px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1280px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 16px; }
  #drop { border:2px dashed var(--line); border-radius:12px; background:var(--card); padding:48px 16px; text-align:center; cursor:pointer; }
  #drop.over { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, var(--card)); }
  button, select { font:inherit; padding:7px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  #work { display:none; }
  .bar { display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .bar label { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; }
  .bar input[type=range] { width:110px; }
  .views { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:800px) { .views { grid-template-columns:1fr; } }
  .view h2 { font-size:13px; font-weight:600; color:var(--muted); margin:0 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  .stage { position:relative; line-height:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#000; touch-action:none; user-select:none; }
  .stage canvas { width:100%; height:auto; display:block; }
  #overlay { position:absolute; inset:0; cursor:crosshair; }
  .box { position:absolute; border:2px solid #22d36b; background:rgba(34,211,107,.08); }
  .box.fit { border:0; background:none; } /* la zona real es el cuadrilátero rosa */
  .box.off { border:2px dashed #aaa; background:rgba(150,150,150,.12); }
  .box.draft { border-color:#ffb020; background:rgba(255,176,32,.2); }
  #status { color:var(--muted); font-size:13px; margin:10px 0; min-height:20px; }
  #list { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; margin-top:12px; }
  .item { display:flex; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; }
  .item canvas { width:84px; height:auto; border-radius:4px; background:#000; }
  .item .meta { flex:1; color:var(--muted); } .item .meta b { color:var(--fg); }
  .item button { padding:3px 9px; font-size:12px; }
  .del { color:var(--danger); }
  .hint { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Matrículas ocultas</h1>
  <p class="sub">Todo se procesa en tu navegador: la foto no se envía a ningún servidor.</p>

  <div id="warn" style="display:none;background:#d1342f;color:#fff;border-radius:8px;padding:10px 14px;margin-bottom:12px"></div>
  <div id="drop"><p><b>Arrastra una foto aquí</b></p><p class="hint">o</p><button class="primary" id="pick">Seleccionar archivo</button>
    <input type="file" id="file" accept="image/*" hidden></div>

  <section id="work">
    <div class="bar">
      <label>Modelo <select id="model"><option value="fast">Rápido (8 MB)</option><option value="accurate">Preciso (29 MB)</option></select></label>
      <label><input type="checkbox" id="tiles" checked> Buscar también por zonas (matrículas lejanas)</label>
      <label>Confianza mín. <input type="range" id="thr" min="0.15" max="0.9" step="0.05" value="0.35"><span id="thrv">0.35</span></label>
      <button id="redetect">Detectar de nuevo</button>
    </div>
    <div class="bar">
      <label>Ocultar con <select id="mode"><option value="fill">Relleno con carrocería cercana</option><option value="smooth">Relleno suave (difusión)</option><option value="lama">Inteligente (IA, LaMa · requiere descarga)</option><option value="color">Pintar del color de la carrocería</option><option value="white">Pintar de blanco</option><option value="blur">Desenfoque fuerte</option><option value="pixel">Pixelado</option></select></label>
      <label>Margen <input type="range" id="pad" min="0" max="12" step="0.5" value="3"><span id="padv">3px</span></label>
      <label>Difuminado <input type="range" id="feather" min="0" max="30" value="2"><span id="featherv">2px</span></label>
      <label><input type="checkbox" id="fit" checked> Ajustar a la silueta de la matrícula</label>
      <label id="strl" hidden>Intensidad <input type="range" id="strength" min="1" max="10" value="6"></label>
    </div>
    <div class="views">
      <div class="view"><h2>Original — clic en una caja para activarla/desactivarla · arrastra para dibujar una nueva</h2>
        <div class="stage" id="stageA"><div id="overlay"></div></div></div>
      <div class="view"><h2>Resultado</h2><div class="stage" id="stageB"></div></div>
    </div>
    <div id="status"></div>
    <div class="bar">
      <label>Formato <select id="fmt"><option value="jpeg">JPG</option><option value="png">PNG</option></select></label>
      <label id="ql">Calidad <input type="range" id="quality" min="70" max="100" value="95"></label>
      <button class="primary" id="download">Descargar imagen</button>
      <button id="another">Otra foto</button>
      <span class="hint" id="dims"></span>
    </div>
    <div id="list"></div>
  </section>
  <p class="hint" style="margin-top:24px">Software libre (GPL-3.0) · <a href="https://github.com/mgoreiro/matriculas-ocultas" style="color:inherit">código fuente</a></p>
</main>
<script>
  // Evita que el navegador abra la foto si la app no cargó, y explica por qué.
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => e.preventDefault());
  function warn(t) { const w = document.getElementById('warn'); w.textContent = t; w.style.display = 'block'; }
  if (location.protocol === 'file:') warn('Abre la app con el servidor local (./serve.py → http://localhost:8765); desde file:// el navegador bloquea los módulos y el modelo.');
  setTimeout(() => { if (!window.__appReady) warn('La app no ha cargado. Ejecuta ./serve.py y abre http://localhost:8765 (revisa la consola del navegador).'); }, 2500);
  addEventListener('error', e => warn('Error: ' + e.message));
</script>
<script src="vendor/ort.wasm.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
