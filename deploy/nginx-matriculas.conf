# Fragmento para el bloque `server { ... }` (el que ya sirve https://midominio.com con TLS) de nginx.
# Publica la app en https://midominio.com/matriculas/  (todas sus rutas son relativas, así que funciona en subruta).
#
#   sudo cp deploy/nginx-matriculas.conf /etc/nginx/snippets/matriculas.conf
#   # y dentro del server { }:   include snippets/matriculas.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# La CSP refuerza la promesa de la app: la página solo puede hablar con su propio origen, así que
# aunque hubiera un fallo la foto no podría enviarse a un tercero. 'wasm-unsafe-eval' lo exige onnxruntime-web.

location = /matriculas { return 301 /matriculas/; }

# Pesados y casi inmutables: caché larga
location ~ ^/matriculas/(vendor|models)/(.+)$ {
    alias /var/www/matriculas-ocultas/$1/$2;
    types { application/wasm wasm; text/javascript js mjs; }
    default_type application/octet-stream;             # .onnx
    gzip on; gzip_types application/wasm text/javascript;   # el .onnx apenas comprime
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /matriculas/ {
    alias /var/www/matriculas-ocultas/;
    index index.html;
    types { text/html html; text/css css; text/javascript js mjs; application/json json; text/plain txt md; }
    gzip on; gzip_types text/css text/javascript application/json;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Si la quieres privada, descomenta (htpasswd -c /etc/nginx/.htpasswd-matriculas usuario):
    # auth_basic "Matrículas ocultas"; auth_basic_user_file /etc/nginx/.htpasswd-matriculas;
}
